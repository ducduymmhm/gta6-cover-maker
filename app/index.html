<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatwave Cover Studio — open-world crime poster maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-sun" aria-hidden="true"></span>
    <div>
      <strong>HEATWAVE</strong> <em>Cover Studio</em>
      <small>Your photos → crime-saga poster art. Runs offline, nothing is uploaded.</small>
    </div>
  </div>
  <div class="topbar-actions">
    <div id="sizePicker" class="segmented" role="group" aria-label="Cover size"></div>
    <button id="exportButton" class="export" type="button">Export PNG</button>
  </div>
</header>
<main class="workspace">
  <aside class="sidebar left">
    <section>
      <h2><b>1</b> Photos</h2>
      <label id="dropZone" class="dropzone">
        <input id="photoInput" type="file" accept="image/*" multiple>
        <span><strong>Add photos</strong> or drop them here</span>
      </label>
      <div id="photoTray" class="tray" aria-label="Loaded photos"></div>
      <button id="useSamples" class="ghost" type="button">Try the sample photos</button>
    </section>
    <section>
      <h2><b>2</b> Layout</h2>
      <div id="layoutPicker" class="layout-grid"></div>
    </section>
    <section>
      <h2><b>3</b> Colour grade</h2>
      <div id="gradePicker" class="grade-list"></div>
    </section>
  </aside>
  <section class="stage" id="stage">
    <div class="canvas-wrap">
      <canvas id="coverPreview" width="1080" height="1080" aria-label="Live cover preview"></canvas>
      <canvas id="selectionOverlay" width="1080" height="1080" aria-hidden="true"></canvas>
    </div>
    <p class="hint">Click a panel to select it · drag to pan · scroll to zoom · drop photos anywhere</p>
  </section>
  <aside class="sidebar right">
    <section>
      <h2><b>4</b> Lettering</h2>
      <label>Caption <textarea id="captionInput" rows="2" maxlength="48">Sunset Heist</textarea></label>
      <label>Tagline <input id="taglineInput" type="text" maxlength="40" value="Only in Palm Coast"></label>
      <div class="row">
        <label>Badge <input id="badgeInput" type="text" maxlength="4" value="HW"></label>
        <label>Title at
          <select id="titlePosition">
            <option value="auto">Auto</option><option value="top">Top</option>
            <option value="center">Centre</option><option value="bottom">Bottom</option>
          </select>
        </label>
      </div>
    </section>
    <section>
      <h2><b>5</b> <span id="panelHeading">Panel 1</span></h2>
      <div id="panelPhotoTray" class="tray small" aria-label="Photo for the selected panel"></div>
      <label class="slider">Zoom <input id="zoomSlider" type="range" min="1" max="4" step="0.01" value="1"></label>
      <div class="button-row">
        <button id="flipPanel" class="ghost" type="button">Flip</button>
        <button id="resetCrop" class="ghost" type="button">Reset crop</button>
      </div>
      <div class="button-row">
        <button id="fillAllPanels" class="ghost" type="button">Fill all with this photo</button>
        <button id="spreadPhotos" class="ghost" type="button">Mix all photos</button>
      </div>
    </section>
    <section>
      <h2><b>6</b> Effects</h2>
      <label class="slider">Grade <input id="gradeStrength" type="range" min="0" max="1.3" step="0.01" value="1"></label>
      <label class="slider">Glow <input id="glowAmount" type="range" min="0" max="1" step="0.01" value="0.6"></label>
      <label class="slider">Halftone <input id="halftoneAmount" type="range" min="0" max="1" step="0.01" value="0.5"></label>
      <label class="slider">Grain <input id="grainAmount" type="range" min="0" max="1" step="0.01" value="0.45"></label>
    </section>
    <p id="status" class="status" role="status"></p>
  </aside>
</main>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
